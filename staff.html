<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock – Staff</title>
<style>
:root{--g:#234639;--ink:#1b2a27;--line:#d3dbd6;--in:#2f7d4f;--out:#b4571e;--red:#c0392b}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#edf0ec;color:var(--ink)}
header{background:var(--g);color:#fff;padding:.7rem 1rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.4rem}
header b{font-size:1.05rem}nav button{background:none;border:0;color:#cfe0d8;padding:.5rem .8rem;font:inherit;border-radius:6px;cursor:pointer}
nav button.on{background:#fff;color:var(--g);font-weight:700}
main{max-width:560px;margin:1rem auto;padding:0 1rem 3rem}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:1rem}
label{display:block;font-weight:600;margin:.8rem 0 .25rem}
input,select{width:100%;font:inherit;padding:.65rem;border:1px solid #b8c4be;border-radius:6px}
button.b{font:inherit;font-weight:700;background:var(--g);color:#fff;border:0;border-radius:6px;padding:.75rem;width:100%;cursor:pointer;margin-top:1rem}
button.s{font:inherit;padding:.3rem .6rem;border:1px solid #b8c4be;background:#fff;border-radius:6px;cursor:pointer}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}.seg input{position:absolute;opacity:0}
.seg span{display:block;text-align:center;padding:.8rem;border:2px solid #b8c4be;border-radius:8px;font-weight:700;cursor:pointer}
.seg input:checked+span.i{background:var(--in);border-color:var(--in);color:#fff}
.seg input:checked+span.o{background:var(--out);border-color:var(--out);color:#fff}
.row{display:flex;justify-content:space-between;gap:.5rem;padding:.6rem 0;border-bottom:1px solid var(--line);align-items:center}
.v{text-decoration:line-through;color:#888}.mute{color:#5d6e69;font-size:.85rem}
#lock{position:fixed;inset:0;background:var(--g);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:9}
#lock form{background:#fff;padding:1.5rem;border-radius:12px;width:min(300px,100%);text-align:center}
#pin{text-align:center;font-size:1.8rem;letter-spacing:.6em;padding-left:.6em}
#toast{position:fixed;left:50%;bottom:1rem;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.7rem 1rem;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.show{opacity:1}#toast.err{background:var(--red)}.hidden{display:none!important}
:focus-visible{outline:3px solid #e0a526;outline-offset:2px}
</style></head><body>
<div id="lock"><form id="pf"><h2 style="margin-top:0">☕ Staff PIN</h2>
<input id="pin" type="password" inputmode="numeric" maxlength="4" required aria-label="PIN">
<p id="pe" style="color:var(--red);min-height:1.3em"></p><button class="b" style="margin:0">Unlock</button></form></div>
<header><b>☕ Stock</b><nav id="nav"><button data-v="form" class="on">Stock In/Out</button><button data-v="recent">My entries</button><button data-v="count">Count</button></nav></header>
<main>
<section id="v-form"><form class="card" id="mf">
<label for="area">Area</label><select id="area"><option value="">All</option><option>Bar</option><option>Kitchen</option></select>
<label for="item">Item</label><select id="item" required></select>
<label>Action</label><div class="seg"><label style="margin:0"><input type="radio" name="t" value="in" checked><span class="i">Stock In</span></label><label style="margin:0"><input type="radio" name="t" value="out"><span class="o">Stock Out</span></label></div>
<label for="qty">Quantity <span id="unit" class="mute"></span></label><input id="qty" type="number" min="0.01" step="any" inputmode="decimal" required>
<label for="reason">Reason</label><select id="reason"></select>
<div id="expw"><label for="exp">Expiry date (if any)</label><input id="exp" type="date"></div>
<label for="staff">Your name</label><input id="staff" required maxlength="40">
<label for="notes">Notes (optional)</label><input id="notes" maxlength="200">
<button class="b">Save movement</button></form></section>
<section id="v-recent" class="hidden"><div class="card" id="rl"></div></section>
<section id="v-count" class="hidden"><form class="card" id="cf">
<p class="mute">Count what is on the shelf. Your manager reviews any difference before stock changes.</p>
<label for="citem">Item</label><select id="citem" required></select>
<label for="cqty">Counted quantity</label><input id="cqty" type="number" min="0" step="any" required>
<label for="cstaff">Your name</label><input id="cstaff" required maxlength="40">
<button class="b">Submit count</button></form></section>
</main><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL="https://nwlgqynzcohwamlfcekk.supabase.co", SUPABASE_KEY="sb_publishable_IesjicwYQCtqBhIBp3YXow_Adg58C-_";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),$=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let PIN=sessionStorage.getItem("pin")||"",items=[];
function toast(m,e){const t=$("#toast");t.textContent=m;t.className="show"+(e?" err":"");clearTimeout(toast.t);toast.t=setTimeout(()=>t.className="",3500)}
async function enter(p){const{data}=await sb.rpc("check_pin",{p_pin:p});if(!data)return false;PIN=p;sessionStorage.setItem("pin",p);$("#lock").classList.add("hidden");$("#staff").value=$("#cstaff").value=localStorage.getItem("staff")||"";load();return true}
if(PIN)enter(PIN).then(ok=>{if(!ok)sessionStorage.removeItem("pin")});
$("#pf").onsubmit=async e=>{e.preventDefault();if(!await enter($("#pin").value)){$("#pe").textContent="Wrong PIN.";$("#pin").value=""}};
$("#nav").onclick=e=>{const b=e.target.closest("button");if(!b)return;document.querySelectorAll("#nav button").forEach(x=>x.classList.toggle("on",x===b));["form","recent","count"].forEach(v=>$("#v-"+v).classList.toggle("hidden",v!==b.dataset.v));if(b.dataset.v==="recent")recent()};
async function load(){const{data,error}=await sb.rpc("staff_items",{p_pin:PIN});if(error)return toast(error.message,1);items=data;fill()}
function fill(){const a=$("#area").value,list=items.filter(i=>!a||i.area===a);
$("#item").innerHTML='<option value="">Select item…</option>'+list.map(i=>`<option value="${i.id}">${esc(i.name)} (${i.quantity} ${esc(i.unit)})</option>`).join("");
$("#citem").innerHTML='<option value="">Select item…</option>'+items.map(i=>`<option value="${i.id}">${esc(i.area)}: ${esc(i.name)}</option>`).join("");unit()}
function unit(){const i=items.find(x=>x.id===$("#item").value);$("#unit").textContent=i?`(${i.unit})`:""}
$("#area").onchange=fill;$("#item").onchange=unit;
const R={in:["Delivery","Returned"],out:["Daily Usage","Spoilage","Waste"]};
function reasons(){const t=document.querySelector('[name=t]:checked').value;$("#reason").innerHTML=R[t].map(r=>`<option>${r}</option>`).join("");$("#expw").classList.toggle("hidden",t!=="in")}
document.querySelectorAll("[name=t]").forEach(r=>r.onchange=reasons);reasons();
$("#mf").onsubmit=async e=>{e.preventDefault();const s=$("#staff").value.trim();
const{error}=await sb.rpc("record_movement",{p_pin:PIN,p_item_id:$("#item").value,p_type:document.querySelector('[name=t]:checked').value,p_qty:+$("#qty").value,p_reason:$("#reason").value,p_staff:s,p_notes:$("#notes").value.trim(),p_expiry:$("#exp").value||null});
if(error)return toast(error.message,1);localStorage.setItem("staff",s);$("#qty").value=$("#notes").value=$("#exp").value="";toast("Saved.");load()};
async function recent(){const{data,error}=await sb.rpc("staff_recent",{p_pin:PIN});if(error)return toast(error.message,1);
$("#rl").innerHTML=data.length?data.map(m=>`<div class="row ${m.voided?"v":""}"><div><b>${m.type==="in"?"+":"−"}${m.quantity}</b> ${esc(m.item_name)}<div class="mute">${esc(m.reason)} · ${esc(m.staff_name)} · ${new Date(m.created_at).toLocaleString()}${m.voided?" · VOIDED":""}</div></div>${m.voided?"":`<button class="s" data-c="${m.id}">Report mistake</button>`}</div>`).join(""):"<p>No entries yet.</p>"}
$("#rl").onclick=async e=>{const id=e.target.dataset.c;if(!id)return;const note=prompt("What is wrong with this entry?");if(!note)return;
const{error}=await sb.rpc("request_correction",{p_pin:PIN,p_movement:id,p_note:note,p_staff:$("#staff").value||"Staff"});toast(error?error.message:"Sent to your manager.",!!error)};
$("#cf").onsubmit=async e=>{e.preventDefault();const s=$("#cstaff").value.trim();
const{error}=await sb.rpc("submit_count",{p_pin:PIN,p_item:$("#citem").value,p_counted:+$("#cqty").value,p_staff:s});
if(error)return toast(error.message,1);localStorage.setItem("staff",s);$("#cqty").value="";toast("Count sent for approval.")};
</script></body></html>
