<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4a0e1a">
<title>Kopi Breyk – Stock</title>
<style>
:root{--m:#4a0e1a;--m2:#6b1a2b;--gold:#d4a94f;--bg:#f7f2ee;--ink:#2a1a1d;--line:#e0d3cd;--in:#2f7d4f;--out:#b4571e;--red:#c0392b}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--m);color:#fff;padding:.7rem 1rem;display:flex;align-items:center;gap:.7rem}
header img{height:38px;width:38px;border-radius:50%;object-fit:cover;background:#fff}
header b{font-size:1.1rem;display:block;line-height:1.1}header small{color:var(--gold)}
main{max-width:560px;margin:1rem auto;padding:0 1rem 3rem}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:.5rem}
.tabs button{font:inherit;font-weight:700;padding:.85rem .4rem;border:2px solid var(--line);background:#fff;border-radius:10px;cursor:pointer;color:var(--ink);border-bottom-width:5px}
.tabs button.in{border-bottom-color:var(--in)}.tabs button.out{border-bottom-color:var(--out)}
.tabs button.on{background:var(--m);color:var(--gold);border-color:var(--m)}
.sub{display:flex;gap:.5rem;margin-bottom:1rem}.sub button{flex:1;font:inherit;padding:.5rem;border:0;background:none;color:var(--m2);text-decoration:underline;cursor:pointer}
.sub button.on{font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:1rem}
.banner{margin:-1rem -1rem 1rem;padding:.7rem 1rem;border-radius:10px 10px 0 0;color:#fff;font-weight:700}
.banner.in{background:var(--in)}.banner.out{background:var(--out)}
label{display:block;font-weight:600;margin:.8rem 0 .25rem}
input,select{width:100%;font:inherit;padding:.7rem;border:1px solid #c9b9b3;border-radius:6px;background:#fff}
button.b{font:inherit;font-weight:700;background:var(--m);color:var(--gold);border:0;border-radius:8px;padding:.85rem;width:100%;cursor:pointer;margin-top:1rem}
button.s{font:inherit;padding:.3rem .6rem;border:1px solid #c9b9b3;background:#fff;border-radius:6px;cursor:pointer}
.sug{border:1px solid var(--line);border-radius:8px;margin-top:.3rem;overflow:hidden}.sug:empty{display:none}
.sug button{display:block;width:100%;text-align:left;font:inherit;padding:.65rem .8rem;border:0;border-bottom:1px solid var(--line);background:#fff;cursor:pointer}
.sug button:hover{background:#f3e9e4}.sug small{color:#7a6a66}.sug .hint{padding:.5rem .8rem;color:#7a6a66;font-size:.88rem}
.filt{display:flex;gap:.4rem;margin:.7rem 0}.filt button{flex:1;font:inherit;padding:.5rem;border:1px solid #c9b9b3;background:#fff;border-radius:8px;cursor:pointer}
.filt button.on{background:var(--m);color:var(--gold);border-color:var(--m);font-weight:700}
.grp{margin:1rem 0 .2rem;font-weight:700;color:var(--m)}.grp small{color:#7a6a66;font-weight:400}.zero{color:var(--red);font-weight:700}
.row{display:flex;justify-content:space-between;gap:.5rem;padding:.6rem 0;border-bottom:1px solid var(--line);align-items:center}
.v{text-decoration:line-through;color:#999}.mute{color:#7a6a66;font-size:.85rem}
#lock{position:fixed;inset:0;background:var(--m);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:9}
#lock form{background:#fff;padding:1.5rem;border-radius:12px;width:min(300px,100%);text-align:center}
#lock img{height:64px;width:64px;border-radius:50%;object-fit:cover}
#pin{text-align:center;font-size:1.8rem;letter-spacing:.6em;padding-left:.6em}
#toast{position:fixed;left:50%;bottom:1rem;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.7rem 1rem;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;z-index:10}
#toast.show{opacity:1}#toast.err{background:var(--red)}.hidden{display:none!important}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style></head><body>
<div id="lock"><form id="pf"><img src="https://kopi-breyk-prototype-6.vercel.app/logo.png" alt="" onerror="this.remove()"><h2 style="margin:.3rem 0 1rem">Staff PIN</h2>
<input id="pin" type="password" inputmode="numeric" maxlength="4" required aria-label="PIN">
<p id="pe" style="color:var(--red);min-height:1.3em"></p><button class="b" style="margin:0">Unlock</button></form></div>
<header><img src="https://kopi-breyk-prototype-6.vercel.app/logo.png" alt="" onerror="this.remove()"><div><b>Kopi Breyk</b><small>Stock</small></div></header>
<main>
<div class="tabs" id="tabs">
<button data-a="Bar" data-t="in" class="in on">Bar · Stock In</button><button data-a="Bar" data-t="out" class="out">Bar · Stock Out</button>
<button data-a="Kitchen" data-t="in" class="in">Kitchen · Stock In</button><button data-a="Kitchen" data-t="out" class="out">Kitchen · Stock Out</button></div>
<div class="sub" id="sub"><button data-v="stocks">All stocks</button><button data-v="recent">Recent entries</button><button data-v="count">Count shelf</button></div>

<section id="v-form"><form class="card" id="mf" autocomplete="off">
<div class="banner in" id="banner"></div>
<label for="q">Item name</label><input id="q" placeholder="Start typing, e.g. egg" required><div class="sug" id="sug"></div>
<label for="qty">Quantity <span id="unit" class="mute"></span></label><input id="qty" type="number" min="0.01" step="any" inputmode="decimal" required>
<label for="reason">Reason</label><select id="reason"></select>
<div id="expw"><label for="exp">Expiry date (if any)</label><input id="exp" type="date"></div>
<label for="staff">Your name</label><input id="staff" required maxlength="40">
<label for="notes">Notes (optional)</label><input id="notes" maxlength="200">
<button class="b">Save</button></form></section>

<section id="v-stocks" class="hidden"><div class="card">
<input id="sq" placeholder="Search all stocks" aria-label="Search stocks">
<div class="filt" id="sa"><button data-a="" class="on">All</button><button data-a="Bar">Bar</button><button data-a="Kitchen">Kitchen</button></div>
<div id="sl"></div></div></section>

<section id="v-recent" class="hidden"><div class="card" id="rl"></div></section>

<section id="v-count" class="hidden"><form class="card" id="cf" autocomplete="off">
<p class="mute">Count what is on the shelf. Your manager reviews any difference before stock changes.</p>
<label for="cq">Item name</label><input id="cq" placeholder="Start typing" required><div class="sug" id="csug"></div>
<label for="cqty">Counted quantity</label><input id="cqty" type="number" min="0" step="any" required>
<label for="cstaff">Your name</label><input id="cstaff" required maxlength="40">
<button class="b">Submit count</button></form></section>
</main><div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL="https://nwlgqynzcohwamlfcekk.supabase.co", SUPABASE_KEY="sb_publishable_IesjicwYQCtqBhIBp3YXow_Adg58C-_";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),$=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let PIN=sessionStorage.getItem("pin")||"",items=[],mode={a:"Bar",t:"in"};
function toast(m,e){const t=$("#toast");t.textContent=m;t.className="show"+(e?" err":"");clearTimeout(toast.t);toast.t=setTimeout(()=>t.className="",3500)}

/* ---- PIN ---- */
async function enter(p){const{data}=await sb.rpc("check_pin",{p_pin:p});if(!data)return false;PIN=p;sessionStorage.setItem("pin",p);$("#lock").classList.add("hidden");$("#staff").value=$("#cstaff").value=localStorage.getItem("staff")||"";load();return true}
if(PIN)enter(PIN).then(ok=>{if(!ok)sessionStorage.removeItem("pin")});
$("#pf").onsubmit=async e=>{e.preventDefault();if(!await enter($("#pin").value)){$("#pe").textContent="Wrong PIN.";$("#pin").value=""}};
async function load(){const{data,error}=await sb.rpc("staff_items",{p_pin:PIN});if(error)return toast(error.message,1);items=data.map(i=>({...i,n:norm(i.name)}))}

/* ---- Smart name matching: ignores capitals, extra spaces and plural "s" ---- */
function norm(s){return String(s).toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim().split(" ").map(w=>w.length>3&&w.endsWith("s")?w.slice(0,-1):w).join(" ")}
function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function match(q,pool){const n=norm(q);if(!n)return{list:[],exact:false};
const ex=pool.filter(i=>i.n===n);if(ex.length===1)return{list:ex,exact:true};
let l=pool.filter(i=>i.n.startsWith(n)||i.n.split(" ").some(w=>w.startsWith(n)));
pool.filter(i=>i.n.includes(n)&&!l.includes(i)).forEach(i=>l.push(i));
if(!l.length)l=pool.map(i=>({i,d:Math.min(lev(i.n,n),...i.n.split(" ").map(w=>lev(w,n)))})).filter(x=>x.d<=Math.max(1,Math.floor(n.length/4))).sort((a,b)=>a.d-b.d).map(x=>x.i);
return{list:l,exact:false}}

/* ---- Reusable type-ahead box ---- */
function picker(inp,box,pool,onPick){let sel=null;const I=$(inp),B=$(box);
const show=()=>{const{list}=match(I.value,pool());sel=null;B.innerHTML=I.value.trim()?(list.length?list.slice(0,6).map(i=>`<button type="button" data-id="${i.id}">${esc(i.name)} <small>${i.quantity} ${esc(i.unit)} in stock</small></button>`).join(""):`<div class="hint">No match. Check the spelling.</div>`):"";};
I.oninput=show;
B.onclick=e=>{const b=e.target.closest("button");if(!b)return;sel=items.find(i=>i.id===b.dataset.id);I.value=sel.name;B.innerHTML="";onPick&&onPick(sel)};
return{get(){const p=pool(),m=match(I.value,p);
if(sel&&norm(I.value)===sel.n)return sel;
if(m.exact||m.list.length===1&&norm(I.value).length>=2&&m.list[0].n.includes(norm(I.value))){sel=m.list[0];I.value=sel.name;B.innerHTML="";onPick&&onPick(sel);return sel}
const other=!m.list.length&&match(I.value,items).list[0];
if(other)toast(`"${other.name}" is in ${other.area}. Use the ${other.area} tab.`,1);
else if(m.list.length)toast("Tap the right item from the list.",1);else toast("Item not found. Ask your manager to add it.",1);
show();return null},
clear(){sel=null;I.value="";B.innerHTML=""}}}
const P1=picker("#q","#sug",()=>items.filter(i=>i.area===mode.a),i=>$("#unit").textContent=`(${i.unit})`);
const P2=picker("#cq","#csug",()=>items);

/* ---- Tabs ---- */
const R={in:["Delivery","Returned"],out:["Daily Usage","Spoilage","Waste"]};
function setMode(a,t){mode={a,t};document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.a===a&&b.dataset.t===t));
document.querySelectorAll("#sub button").forEach(b=>b.classList.remove("on"));show("form");
$("#banner").className="banner "+t;$("#banner").textContent=`${a} · Stock ${t==="in"?"In":"Out"}`;
$("#reason").innerHTML=R[t].map(r=>`<option>${r}</option>`).join("");$("#expw").classList.toggle("hidden",t!=="in");P1.clear();$("#unit").textContent=""}
function show(v){["form","stocks","recent","count"].forEach(x=>$("#v-"+x).classList.toggle("hidden",x!==v))}
$("#tabs").onclick=e=>{const b=e.target.closest("button");if(b)setMode(b.dataset.a,b.dataset.t)};
$("#sub").onclick=e=>{const b=e.target.closest("button");if(!b)return;document.querySelectorAll("#tabs button").forEach(x=>x.classList.remove("on"));
document.querySelectorAll("#sub button").forEach(x=>x.classList.toggle("on",x===b));show(b.dataset.v);if(b.dataset.v==="recent")recent();if(b.dataset.v==="stocks")openStocks()};
setMode("Bar","in");

/* ---- Save movement ---- */
$("#mf").onsubmit=async e=>{e.preventDefault();const it=P1.get();if(!it)return;const s=$("#staff").value.trim();
const{error}=await sb.rpc("record_movement",{p_pin:PIN,p_item_id:it.id,p_type:mode.t,p_qty:+$("#qty").value,p_reason:$("#reason").value,p_staff:s,p_notes:$("#notes").value.trim(),p_expiry:mode.t==="in"?($("#exp").value||null):null});
if(error)return toast(error.message,1);localStorage.setItem("staff",s);toast(`Saved: ${mode.t==="in"?"+":"−"}${$("#qty").value} ${it.name}`);
P1.clear();$("#qty").value=$("#notes").value=$("#exp").value="";$("#unit").textContent="";load();$("#q").focus()};

/* ---- My entries / mistakes ---- */
async function recent(){const{data,error}=await sb.rpc("staff_recent",{p_pin:PIN});if(error)return toast(error.message,1);
$("#rl").innerHTML=data.length?data.map(m=>`<div class="row ${m.voided?"v":""}"><div><b>${m.type==="in"?"+":m.type==="out"?"−":"±"}${m.quantity}</b> ${esc(m.item_name)}<div class="mute">${esc(m.reason)} · ${esc(m.staff_name)} · ${new Date(m.created_at).toLocaleString()}${m.voided?" · VOIDED":""}</div></div>${m.voided?"":`<button class="s" data-c="${m.id}">Report mistake</button>`}</div>`).join(""):"<p>No entries yet.</p>"}
$("#rl").onclick=async e=>{const id=e.target.dataset.c;if(!id)return;const note=prompt("What is wrong with this entry?");if(!note)return;
const{error}=await sb.rpc("request_correction",{p_pin:PIN,p_movement:id,p_note:note,p_staff:$("#staff").value||"Staff"});toast(error?error.message:"Sent to your manager.",!!error)};

/* ---- All stocks (Bar + Kitchen) ---- */
let SA="";
async function openStocks(){await load();stocks()}
function stocks(){const q=norm($("#sq").value),l=items.filter(i=>(!SA||i.area===SA)&&(!q||i.n.includes(q)));let h="";
["Bar","Kitchen"].forEach(a=>{const al=l.filter(i=>i.area===a);if(!al.length)return;
[...new Set(al.map(i=>i.category))].sort().forEach(c=>{h+=`<div class="grp">${a} · ${esc(c)}</div>`+al.filter(i=>i.category===c).map(i=>`<div class="row"><span>${esc(i.name)}</span><b class="${+i.quantity<=0?"zero":""}">${+i.quantity<=0?"Out of stock":(+i.quantity).toLocaleString(undefined,{maximumFractionDigits:2})+" "+esc(i.unit)}</b></div>`).join("")})});
$("#sl").innerHTML=h||"<p class='mute'>Nothing found.</p>"}
$("#sq").oninput=stocks;
$("#sa").onclick=e=>{const b=e.target.closest("button");if(!b)return;SA=b.dataset.a;document.querySelectorAll("#sa button").forEach(x=>x.classList.toggle("on",x===b));stocks()};

/* ---- Stocktake count ---- */
$("#cf").onsubmit=async e=>{e.preventDefault();const it=P2.get();if(!it)return;const s=$("#cstaff").value.trim();
const{error}=await sb.rpc("submit_count",{p_pin:PIN,p_item:it.id,p_counted:+$("#cqty").value,p_staff:s});
if(error)return toast(error.message,1);localStorage.setItem("staff",s);P2.clear();$("#cqty").value="";toast("Count sent for approval.")};
</script></body></html>
